name: Build native dependencies (SDL2)

# Change SDL2 version based on https://github.com/libsdl-org/SDL/releases, but remember to check what SDL2 version SDL2-CS targets.
# Change Chromium revision numbers based on https://chromium.woolyss.com/download/.
env:
    SDL2_VERSION: 2.32.10 # Make sure this matches the version mentioned in the description in the .nuspec file.
    CHROMIUM_BUILD_x86: 1136315
    CHROMIUM_BUILD_x64: 1136314

on:
    pull_request:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    windows:
        name: Windows (x86 + x64)
        runs-on: windows-2022
        steps:
            - name: Setup Dependencies
              shell: pwsh
              run: |
                New-Item -ItemType Directory -Force -Path artifacts/x86 | Out-Null
                New-Item -ItemType Directory -Force -Path artifacts/x64 | Out-Null

            - name: Build SDL2 (x86 + x64)
              shell: pwsh
              run: |

                $sdlZip = "SDL2-${env:SDL2_VERSION}.zip"
                $sdlUrl = "https://github.com/libsdl-org/SDL/releases/download/release-${env:SDL2_VERSION}/$sdlZip"

                Invoke-WebRequest -Uri $sdlUrl -OutFile $sdlZip
                Expand-Archive -Path $sdlZip -DestinationPath .
                $sdlRoot = "SDL2-${env:SDL2_VERSION}"

                # Build x86
                cmake -S $sdlRoot -B build-x86 -A Win32 -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
                cmake --build build-x86 --config Release
                Copy-Item "build-x86/Release/SDL2.dll" "artifacts/x86/SDL2.dll" -Force

                # Build x64
                cmake -S $sdlRoot -B build-x64 -A x64 -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
                cmake --build build-x64 --config Release
                Copy-Item "build-x64/Release/SDL2.dll" "artifacts/x64/SDL2.dll" -Force

            - name: Download ANGLE
              shell: pwsh
              run: |

                # x86 ANGLE
                Invoke-WebRequest -Uri "https://storage.googleapis.com/chromium-browser-snapshots/Win/${env:CHROMIUM_BUILD_x86}/chrome-win.zip" -OutFile "chrome-win-x86.zip"
                Expand-Archive -Path "chrome-win-x86.zip" -DestinationPath "chrome-win-x86"
                Copy-Item "chrome-win-x86/chrome-win/libEGL.dll" "artifacts/x86/libEGL.dll" -Force
                Copy-Item "chrome-win-x86/chrome-win/libGLESv2.dll" "artifacts/x86/libGLESv2.dll" -Force

                # x64 ANGLE
                Invoke-WebRequest -Uri "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/${env:CHROMIUM_BUILD_x64}/chrome-win.zip" -OutFile "chrome-win-x64.zip"
                Expand-Archive -Path "chrome-win-x64.zip" -DestinationPath "chrome-win-x64"
                Copy-Item "chrome-win-x64/chrome-win/libEGL.dll" "artifacts/x64/libEGL.dll" -Force
                Copy-Item "chrome-win-x64/chrome-win/libGLESv2.dll" "artifacts/x64/libGLESv2.dll" -Force

            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                name: Natives-Windows
                path: ./artifacts

    macos:
        name: macOS (x64 + arm64)
        runs-on: macos-14
        steps:
            - name: Setup Dependencies
              run: |
                mkdir -p artifacts/x86_64
                mkdir artifacts/arm64

            - name: Compile Natives
              run: |
                curl -s -L -O https://www.libsdl.org/release/SDL2-${SDL2_VERSION}.tar.gz
                tar xf SDL2-${SDL2_VERSION}.tar.gz
                mkdir SDL2-${SDL2_VERSION}/build
                cd SDL2-${SDL2_VERSION}/build
                CC=../build-scripts/clang-fat.sh ../configure --without-x --disable-jack --disable-static --prefix "${PWD}"
                make
                make install
                lipo -thin x86_64 lib/libSDL2-2.0.0.dylib -output ../../artifacts/x86_64/SDL2.dylib
                lipo -thin arm64 lib/libSDL2-2.0.0.dylib -output ../../artifacts/arm64/SDL2.dylib

            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                name: Natives-MacOS
                path: ./artifacts

    # Note: Running inside a RockyLinux container because we want to compile using a version of glibc
    # that is as old as reasonably possible to ensure backwards compatibility of the compiled binaries.
    linux-x64:
        name: Linux (x64)
        runs-on: ubuntu-22.04
        container: rockylinux:8
        steps:
            - name: Setup Dependencies
              run: |
                mkdir -p artifacts/x64
                dnf -y upgrade
                dnf install -y "dnf-command(config-manager)"
                dnf config-manager --set-enabled powertools
                dnf install -y epel-release
                dnf groupinstall -y "Development Tools"
                dnf -y update
                dnf install -y libXext-devel libX11-devel mesa-libGL-devel mesa-libGLU-devel libXrender-devel libXrandr-devel libXcursor-devel libXinerama-devel libXi-devel wayland-devel wayland-protocols-devel libxkbcommon-x11-devel

            - name: Compile Natives
              run: |
                curl -s -L -O https://www.libsdl.org/release/SDL2-${SDL2_VERSION}.tar.gz
                tar xf SDL2-${SDL2_VERSION}.tar.gz
                cd SDL2-${SDL2_VERSION}
                ./configure --disable-rpath --enable-loadso --disable-audio --disable-sensor --enable-x11-shared --enable-video-wayland --enable-wayland-shared --disable-video-directfb --disable-video-vulkan --disable-video-dummy --disable-power --disable-joystick --disable-haptic --disable-filesystem --disable-file --disable-cpuinfo --prefix "${PWD}"
                make
                make install
                cp lib/libSDL2.so ../artifacts/x64/SDL2.so

            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                name: Natives-Linux(x64)
                path: ./artifacts

    linux-arm64:
        name: Linux (arm64)
        runs-on: ubuntu-22.04-arm
        steps:
            - name: Setup Dependencies
              run: |
                mkdir -p artifacts/arm64
                sudo apt-get install -y build-essential pkgconf curl libxext-dev libx11-dev libwayland-dev libgl1-mesa-dev libglu1-mesa-dev libxrender-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxkbcommon-dev
            - name: Compile Natives
              run: |
                curl -s -L -O https://www.libsdl.org/release/SDL2-${SDL2_VERSION}.tar.gz
                tar xf SDL2-${SDL2_VERSION}.tar.gz
                cd SDL2-${SDL2_VERSION}
                ./configure --disable-rpath --enable-loadso --disable-audio --disable-sensor --enable-x11-shared --enable-video-wayland --enable-wayland-shared --disable-video-directfb --disable-video-vulkan --disable-video-dummy --disable-power --disable-joystick --disable-haptic --disable-filesystem --disable-file --disable-cpuinfo --prefix "${PWD}"
                make
                make install
                cp lib/libSDL2.so ../artifacts/arm64/SDL2.so

            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                name: Natives-Linux(arm64)
                path: ./artifacts
